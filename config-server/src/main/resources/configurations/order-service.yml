spring:
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:ecommerce}?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:longga@12}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
server:
  port: 8083
  servlet:
    context-path: /order

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs